<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>" />
<title>تبدیل متن به گفتار</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font-family: Vazirmatn, Tahoma, system-ui, sans-serif; max-width: 780px;
         margin: 2rem auto; padding: 0 1rem; background: light-dark(#fafafa, #111);
         color: light-dark(#1a1a1a, #eee); }
  h1 { font-size: 1.3rem; }
  textarea { width: 100%; min-height: 220px; font: inherit; font-size: 1.05rem; line-height: 1.9;
             padding: .9rem; border-radius: 12px; border: 1px solid light-dark(#ccc, #444);
             background: light-dark(#fff, #1c1c1c); color: inherit; resize: vertical; }
  button { font: inherit; padding: .65rem 1.6rem; border-radius: 10px; border: 0; cursor: pointer;
           background: #2563eb; color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 1rem; align-items: center; margin-top: .8rem; flex-wrap: wrap; }
  .hint { color: light-dark(#666, #999); font-size: .85rem; }
  .err { color: #dc2626; margin-top: .6rem; }
  audio { width: 100%; margin-top: 1rem; }
  #result { margin-top: .5rem; }
  a.dl { font-size: .9rem; }
</style>
</head>
<body>
<h1>تبدیل متن به گفتار — صدای شبیه‌سازی‌شده</h1>
<textarea id="text" dir="rtl" placeholder="متن فارسی را اینجا وارد کنید…"></textarea>
<div class="row">
  <button id="go">تولید صدا</button>
  <span class="hint" id="count">۰ حرف — هر جمله جدا ساخته می‌شود، متن طولانی چند دقیقه طول می‌کشد</span>
</div>
<div class="row"><input id="key" type="password" placeholder="کلید API (اگر تنظیم شده)" style="font:inherit;padding:.5rem .8rem;border-radius:8px;border:1px solid light-dark(#ccc,#444);background:light-dark(#fff,#1c1c1c);color:inherit"/></div>
<div class="err" id="err" hidden></div>
<div id="result"></div>

<script>
const $ = (id) => document.getElementById(id);
const text = $("text"), go = $("go"), err = $("err"), result = $("result"), count = $("count"), key = $("key");
key.value = localStorage.getItem("tts-key") || "";
key.addEventListener("input", () => localStorage.setItem("tts-key", key.value));
let timer = null;

text.addEventListener("input", () => {
  count.textContent = `${text.value.length} حرف — هر جمله جدا ساخته می‌شود، متن طولانی چند دقیقه طول می‌کشد`;
});

go.addEventListener("click", async () => {
  const t = text.value.trim();
  if (!t) return;
  err.hidden = true; result.innerHTML = "";
  go.disabled = true;
  const t0 = Date.now();
  timer = setInterval(() => {
    go.textContent = `در حال تولید… ${Math.round((Date.now() - t0) / 1000)} ثانیه`;
  }, 1000);
  go.textContent = "در حال تولید…";
  try {
    const res = await fetch("/api/tts", {
      method: "POST",
      headers: { "content-type": "application/json", ...(key.value ? { "x-api-key": key.value } : {}) },
      body: JSON.stringify({ text: t }),
    });
    if (!res.ok) {
      let msg = "خطا: " + res.status;
      try { msg = (await res.json()).error || msg; } catch {}
      throw new Error(msg);
    }
    const url = URL.createObjectURL(await res.blob());
    const audio = document.createElement("audio");
    audio.controls = true; audio.src = url; audio.autoplay = true;
    const dl = document.createElement("a");
    dl.className = "dl"; dl.href = url; dl.download = "tts.wav";
    dl.textContent = "دانلود فایل صوتی";
    result.append(audio, dl);
  } catch (e) {
    err.textContent = String(e.message || e); err.hidden = false;
  } finally {
    clearInterval(timer);
    go.disabled = false; go.textContent = "تولید صدا";
  }
});
</script>
</body>
</html>
